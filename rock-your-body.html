<!DOCTYPE html>
<html>
<head>
<meta property="og:type" content="video.other">
<meta property="og:title" content="rock your body">
<meta property="og:video" content="https://the-fog-is-comign.github.io/careful-giggles/rock-your-body.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="200">
<meta property="og:video:height" content="200">
<meta property="og:image" content="https://the-fog-is-comign.github.io/careful-giggles/rock-your-body-cover.png">
</head>
<body style="margin:0;">
<video id="__v" autoplay loop muted playsinline style="width:100%;height:100%;">
  <source src="rock-your-body.mp4" type="video/mp4">
</video>
<button id="__soundBtn" style="position:fixed;bottom:16px;right:16px;z-index:9999;padding:10px 14px;border:none;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font:14px system-ui,sans-serif;cursor:pointer;">🔇 Tap for sound</button>
<script>
(function () {
  var v = document.getElementById('__v');
  var btn = document.getElementById('__soundBtn');

  function enableSound() {
    v.muted = false;
    v.play().catch(function () {});
    btn.remove();

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "rock your body",
        artist: "dipper",
        album: "",
        artwork: [{ src: "https://the-fog-is-comign.github.io/careful-giggles/rock-your-body-cover.png", sizes: '512x512', type: "image/png" }]
      });
      navigator.mediaSession.setActionHandler('play', function () { v.play(); });
      navigator.mediaSession.setActionHandler('pause', function () { v.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function (d) {
        v.currentTime = Math.max(0, v.currentTime - (d.seekOffset || 10));
      });
      navigator.mediaSession.setActionHandler('seekforward', function (d) {
        v.currentTime = Math.min(v.duration || Infinity, v.currentTime + (d.seekOffset || 10));
      });
      v.addEventListener('play', function () { navigator.mediaSession.playbackState = 'playing'; });
      v.addEventListener('pause', function () { navigator.mediaSession.playbackState = 'paused'; });
    }

    if ('audioSession' in navigator) {
      try { navigator.audioSession.type = 'playback'; } catch (e) {}
    }
  }

  btn.addEventListener('click', enableSound, { once: true });
})();
</script>
</body>
</html>
